[package]
name = "banken-spec"
description = "The postigo action-legality citizenship primitive — a TYPED-SPEC + INTERPRETER triplet for banken (the pleme-io-native k9s). Types are the hard border; the (defk8sview)/(defk8saction) Lisp forms are the authoring surface; the ClusterEnv trait has no unwitnessed-mutate method by construction. Proven against a mock cluster, no live cluster required."
keywords = ["kubernetes", "k9s", "gitops", "tui", "tatara"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The fleet keybinding vocabulary. `ActionChord` wraps `awase::Hotkey`
# (NOT `awase::KeyChord`, which is a two-step leader→follower chord —
# see src/chord.rs for the correction to BANKEN.md §III.a), and
# `bindings::build_binding_map` makes two actions on one chord an error
# rather than last-write-wins.
awase = "0.1"

# The fleet widget-STATE vocabulary. Present for exactly one reason: the
# `egaku::TableRow` impl on `env::Row` (see `env.rs`). Rust's orphan rule
# puts that impl in Row's own crate or nowhere — `banken` cannot write
# `impl egaku::TableRow for banken_spec::env::Row`, both halves being
# foreign to it.
#
# This does NOT drag a renderer in. egaku is pure logic — serde / tracing /
# thiserror / unicode-* and no drawing surface at all (that is what lets one
# egaku value drive a GPU pane via garasu and a TTY pane via egaku-term). So
# banken-spec stays a spec crate; it has simply declared that its read type
# is displayable as a table row, which is a property of the DATA.
egaku = "0.1"

# ONE dep, not two: the derive macros arrive RENAMED through
# `tatara_lisp::DeriveTataraDomain`, so `tatara-lisp-derive` is never
# named here (see the workspace manifest).
tatara-lisp.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints.clippy]
pedantic = "warn"
