[workspace]
resolver = "2"
members = ["banken-spec", "banken-config", "banken"]

[workspace.package]
version = "0.1.29"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/banken"

[workspace.dependencies]
# The postigo typed border authoring surface — pleme-io's homoiconic
# S-expression reader, published on crates.io from the canonical
# `pleme-io/tatara-lisp` workspace (all 17 members released in lockstep
# at 0.3.3; the retired `pleme-io/tatara` sibling is `publish = false`).
#
# ONE dependency, deliberately: `tatara-lisp` re-exports the derive
# macros RENAMED — `DeriveTataraDomain` / `DeriveKeywordSexp` (lib.rs:54)
# — so a consumer never names `tatara-lisp-derive` itself. That kills the
# split-pin class outright: the lib pins its own derive at `=0.3.3`, so
# the derive's emitted `::tatara_lisp::domain::parse_kwargs` call can no
# longer reference a symbol the resolved runtime doesn't ship. banken
# uses only `#[tatara(keyword = "…")]`.
tatara-lisp = "0.3.3"

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

