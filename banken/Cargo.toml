[package]
name = "banken"
description = "banken 番犬 — the pleme-io-native k9s (naturalize). An observe-first, GitOps-native cluster-navigator TUI: a live :pods table rendered through egaku-term's typed cell surface, with every action routed through the postigo three-class action-legality gate (OBSERVE reads, DECLARE lowers to a full-manifest GitOps change, BREAK-GLASS is witnessed). Proven against a fixture cluster source this session; the live-cluster read is wired behind the ClusterEnv seam under the `live` feature."
keywords = ["kubernetes", "k9s", "gitops", "tui", "egaku"]
categories = ["command-line-interface"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "banken"
path = "src/main.rs"

[dependencies]
banken-spec = { path = "../banken-spec" }
# *** WIRED 2026-08-08. It was NOT a dependency of this binary. ***
# `banken-config` shipped 16 green tests and carried both faces on one struct
# (the `defbanken` Lisp keyword + `impl shikumi::TieredConfig`) — and nothing
# consumed it. `main.rs` hardcoded the poll interval, so `:refresh-interval-ms`
# was authored, tested, and IGNORED. A config surface nothing reads is worse
# than no config surface, because it looks like it works.
banken-config = { path = "../banken-config" }
# The fleet keybinding vocabulary. banken uses awase's typed `Hotkey`/`Key`
# to construct `banken_spec::chord::ActionChord` values and `KeyRepeatGate`
# to debounce the held-key path on the three postigo action chords.
awase = "0.1"
# The widget-STATE half of the fleet TUI vocabulary. `egaku::TableView<Row>`
# is the generic table model banken's `PodTable` used to hand-roll — promoted
# out of this repo by egaku `e602369`, which lifted it from that very file and
# closed `pending-banken: promote-tableview-to-egaku`. Named directly rather
# than reached through egaku-term because banken uses the *model* (columns,
# cursor, sort) far more than it uses egaku-term's re-exports, and a widget
# state machine reached through a renderer reads as if it needed one.
egaku = "0.1"
# Back to a crates.io version, as the git+rev comment here promised. That
# pin existed because egaku-term's release was wedged twice over — a rebase
# conflict in `bump` (fixed in pleme-io/actions 6907a60) masking a git
# dependency that made the crate structurally unreleasable (fixed in
# egaku-term d61fafa). 0.3.6 is published and carries `AsyncApp::wake`.
egaku-term = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# izumi (泉) — the fleet's live-source absorb plane. banken uses ONE piece of
# it: `refresh::{LiveStore, spawn_interval_refresh}`, the reusable
# blocking-read-on-a-cadence loop that keeps `:pods` moving without a
# keystroke (see `crate::feed`). Deliberately NOT `izumi::Engine` — that seam
# runs a source through a subprocess `Environment`, which cannot express a
# typed `kube` client call, and forcing it through would have broken izumi's
# own mock contract to reach a fit that was never there.
# A plain version: izumi 0.1.14 is on crates.io, and a git dep would make
# banken itself unreleasable (crates.io refuses them).
izumi = "0.1"
# The fleet's established lock-free read-hot-path primitive (20 crates declare
# it). The render path loads the absorbed snapshot every frame; `ArcSwap` makes
# that one atomic with no contention against the writing task, where an
# `RwLock` would put the drawer behind the absorber. The published `Snapshot`
# is immutable, so a frame cannot tear.
arc-swap = "1"

# ── The live-cluster read path (BANKEN.md §VI M0 destination-tier). ──
# Gated behind the `live` feature so the default build (the fixture path
# proven this session) stays lean + green. NO `kubectl` subprocess — the
# NO-SHELL rule holds; this is a typed apiserver client. The code is real
# (never a fake `Ok`), but is UNTESTED-LIVE this session (no cluster
# reachable — rio/camelot VPN-gated, local k3s down). `pending-banken:
# live-read` — the row lights up the instant a cluster returns.
# *** `runtime` added 2026-08-08 — the watch informer was never missing upstream. ***
# BANKEN.md's C-watch ceiling read as "unbuilt substrate banken must build", and
# that was a fact about this feature list, not about kube-rs. `kube-runtime`
# 0.99 already ships `InitialListStrategy::StreamingList` + `Config::streaming_lists()`
# (`watcher.rs:405`), `bookmarks: true` by default (`:287`), `metadata_watcher`
# (`:823`), and the whole resourceVersion/410-Gone machine. Turning the feature on
# is the entire acquisition.
#
# What it replaces, measured against camelot-eks (191 pods) on 2026-08-08:
# `Api::list(&ListParams::default())` at 1 Hz moves 3,580,862 B per tick —
# 3.4 MiB/s decoded, 12 GiB/hour, 96 GiB per 8-hour day, per instance. A 30 s
# watch on the same cluster at the same moment moved 0 bytes. Delta traffic is
# proportional to CHANGE; poll traffic is proportional to STATE SIZE.
#
# EXP-9 (blocking, per the plan): verified `cargo tree -p banken --features live`
# carries `ring` and NO `aws-lc-rs` both before and after this change, so the
# rustls `CryptoProvider` ambiguity that aborted the first live read
# (`rustls-0.23.42/src/crypto/mod.rs:249`) is not reintroduced. `live.rs`'s
# explicit `ensure_crypto_provider()` remains the belt to this braces.
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls", "runtime"], optional = true }
k8s-openapi = { version = "0.24", features = ["latest"], optional = true }
anyhow = { version = "1", optional = true }
# *** NOT redundant with kube's `rustls-tls`. Measured 2026-07-31. ***
# kube 0.99's `rustls-tls` pulls rustls 0.23 with features
# `log,logging,std,tls12` and selects NO crypto provider — neither `ring` nor
# `aws-lc-rs`. rustls then has no process default, and the FIRST TLS handshake
# panics at `rustls/src/crypto/mod.rs:249` ("Could not automatically determine
# the process-level CryptoProvider"). That is a RUNTIME panic behind a clean
# compile, which is exactly why "the live backend compiles" was never evidence
# that it reads. Naming the provider here is the load-bearing fix; `live.rs`
# also installs it explicitly so a future crate enabling `aws-lc-rs` turns the
# ambiguity into a no-op rather than back into a panic.
# `ring` over `aws-lc-rs`: aws-lc-rs is an FFI binding to the AWS-LC C library,
# and the fleet's Rust standard is pure-Rust deps without FFI.
# Stream combinators for the absorb plane's watch loop (`pin_mut!` + `.next()`).
# kube-runtime's own surface is a `Stream`, so this is the same dependency it
# already carries transitively — named here because banken uses it directly.
futures = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# ── The live tear handoff for `(defbancada)` (the bancada bridge). ──
# `tear-client::Client` implements `tear_types::MultiplexerControl`, which is
# the surface `banken_spec::bancada::SessionEnv` was shaped as a projection of
# — so the adapter is a rename, not a translation layer. Gated behind the
# `tear` feature: it drags tear-config → shikumi's figment/notify tree into the
# binary, which the default (fixture) build has no use for.
#
# *** REGISTRY, NOT GIT — corrected 2026-08-07. ***
# These were `git = "https://github.com/pleme-io/tear", branch = "main"`, and
# the comment here recorded the consequence in detail: banken's Cargo.lock
# carried zero git sources before the dep and four after (tear, shikumi, gen,
# and a SECOND ishou-tokens 0.1.4 from git alongside banken-config's registry
# one). Cargo resolves the lock feature-independently, so crate2nix saw those
# git crates even though the default build never compiled them — the
# crate2nix-vs-fetchgit base32-vs-SRI drift class (`nix run .#hashfix -- loop`),
# plus a `branch = "main"` float that pins nothing.
#
# The whole cost was avoidable: tear-client and tear-types are BOTH published
# on crates.io (0.1.12, verified against the sparse index). A pleme-io crate
# reaches another pleme-io crate through the registry, never through git — a
# git dep also makes the depending crate structurally unreleasable, which is
# the same wall egaku-term and izumi already hit in this file.
tear-client = { version = "0.1", optional = true }
tear-types = { version = "0.1", optional = true }

[features]
# `live` is ON by default (2026-08-07). It was off, and the stated reason —
# "the fixture path is fast" — was a producer-side convenience that the
# CONSUMER paid for: substrate's rust tool-release shape reads its feature set
# from gen's build spec (cargo's default resolve) and exposes no per-consumer
# feature knob, so `pkgs.banken` — the ONLY way this binary reaches a node —
# was structurally the fixture build. A cluster navigator that answers
# `--live` with "requires building with --features live" is not a navigator;
# the default has to be the binary an operator actually wants. Every dep this
# turns on is a registry dep (kube / k8s-openapi / anyhow / rustls+ring), so
# the crates.io release shape is unchanged.
#
# `tear` comes with it. The reason it was held back was never the feature —
# it was that its two deps were GIT sources, i.e. the crate2nix-vs-fetchgit
# hash-drift class. Repointing them at crates.io (see the tear-client comment
# above) removes that objection, and with it `pending-banken:
# bancada-tear-feature-nix-unverified`, so there is nothing left to justify
# shipping `UnwiredSessionEnv`'s typed refusal to every node when the real
# adapter is one registry dep away.
default = ["live", "tear"]
# Compile the KubeClusterEnv live-read backend. Heavy dep tree (kube +
# k8s-openapi + rustls).
live = ["dep:kube", "dep:k8s-openapi", "dep:anyhow", "dep:rustls", "dep:futures"]
# Compile the TearSessionEnv adapter — the live `(defbancada)` handoff over a
# running `tear-daemon`. Off by default: the plan is produced and previewed
# without it, and the dep tree is heavy.
tear = ["dep:tear-client", "dep:tear-types"]

[lints.clippy]
pedantic = "warn"
