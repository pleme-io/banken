[package]
name = "banken"
description = "banken 番犬 — the pleme-io-native k9s (naturalize). An observe-first, GitOps-native cluster-navigator TUI: a live :pods table rendered through egaku-term's typed cell surface, with every action routed through the postigo three-class action-legality gate (OBSERVE reads, DECLARE lowers to a full-manifest GitOps change, BREAK-GLASS is witnessed). Proven against a fixture cluster source this session; the live-cluster read is wired behind the ClusterEnv seam under the `live` feature."
keywords = ["kubernetes", "k9s", "gitops", "tui", "egaku"]
categories = ["command-line-interface"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "banken"
path = "src/main.rs"

[dependencies]
banken-spec = { path = "../banken-spec" }
# The fleet keybinding vocabulary. banken uses awase's typed `Hotkey`/`Key`
# to construct `banken_spec::chord::ActionChord` values and `KeyRepeatGate`
# to debounce the held-key path on the three postigo action chords.
awase = "0.1"
# The widget-STATE half of the fleet TUI vocabulary. `egaku::TableView<Row>`
# is the generic table model banken's `PodTable` used to hand-roll — promoted
# out of this repo by egaku `e602369`, which lifted it from that very file and
# closed `pending-banken: promote-tableview-to-egaku`. Named directly rather
# than reached through egaku-term because banken uses the *model* (columns,
# cursor, sort) far more than it uses egaku-term's re-exports, and a widget
# state machine reached through a renderer reads as if it needed one.
egaku = "0.1"
# git+rev, not a crates.io version, and NOT by preference: egaku-term's
# auto-release has been failing since 0.3.2 (rebase conflict in the bump job),
# so crates.io still serves 0.3.1 — which predates `AsyncApp::wake` and cannot
# build `crate::feed`. Pinning the rev is the honest way to depend on code
# that exists; the alternative was to pretend a published 0.3.4 was there.
# Swap back to `version = "0.3.4"` the moment the release pipeline is green.
egaku-term = { git = "https://github.com/pleme-io/egaku-term", rev = "04539db", version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# izumi (泉) — the fleet's live-source absorb plane. banken uses ONE piece of
# it: `refresh::{LiveStore, spawn_interval_refresh}`, the reusable
# blocking-read-on-a-cadence loop that keeps `:pods` moving without a
# keystroke (see `crate::feed`). Deliberately NOT `izumi::Engine` — that seam
# runs a source through a subprocess `Environment`, which cannot express a
# typed `kube` client call, and forcing it through would have broken izumi's
# own mock contract to reach a fit that was never there.
# git+rev pin, the madori/irodzuki idiom; bump the rev to track izumi.
izumi = { git = "https://github.com/pleme-io/izumi", rev = "50ab0f6", version = "0.1" }

# ── The live-cluster read path (BANKEN.md §VI M0 destination-tier). ──
# Gated behind the `live` feature so the default build (the fixture path
# proven this session) stays lean + green. NO `kubectl` subprocess — the
# NO-SHELL rule holds; this is a typed apiserver client. The code is real
# (never a fake `Ok`), but is UNTESTED-LIVE this session (no cluster
# reachable — rio/camelot VPN-gated, local k3s down). `pending-banken:
# live-read` — the row lights up the instant a cluster returns.
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.24", features = ["latest"], optional = true }
anyhow = { version = "1", optional = true }
# *** NOT redundant with kube's `rustls-tls`. Measured 2026-07-31. ***
# kube 0.99's `rustls-tls` pulls rustls 0.23 with features
# `log,logging,std,tls12` and selects NO crypto provider — neither `ring` nor
# `aws-lc-rs`. rustls then has no process default, and the FIRST TLS handshake
# panics at `rustls/src/crypto/mod.rs:249` ("Could not automatically determine
# the process-level CryptoProvider"). That is a RUNTIME panic behind a clean
# compile, which is exactly why "the live backend compiles" was never evidence
# that it reads. Naming the provider here is the load-bearing fix; `live.rs`
# also installs it explicitly so a future crate enabling `aws-lc-rs` turns the
# ambiguity into a no-op rather than back into a panic.
# `ring` over `aws-lc-rs`: aws-lc-rs is an FFI binding to the AWS-LC C library,
# and the fleet's Rust standard is pure-Rust deps without FFI.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# ── The live tear handoff for `(defbancada)` (the bancada bridge). ──
# `tear-client::Client` implements `tear_types::MultiplexerControl`, which is
# the surface `banken_spec::bancada::SessionEnv` was shaped as a projection of
# — so the adapter is a rename, not a translation layer. Gated behind the
# `tear` feature: it drags tear-config → shikumi's figment/notify tree into the
# binary, which the default (fixture) build has no use for.
#
# *** LOCK-SHAPE CONSEQUENCE — read before assuming `nix build` is unaffected. ***
# banken's Cargo.lock carried **zero** git sources before this dep; it now
# carries four (tear, shikumi, gen, and a SECOND ishou-tokens 0.1.4 from git,
# alongside the registry one banken-config keeps — measured, so banken-config's
# published-0.1.4 theme receipt is unchanged). Cargo resolves the lock
# feature-independently, so crate2nix sees those git crates even though the
# default build never compiles them, which is the documented
# crate2nix-vs-fetchgit base32-vs-SRI drift class (`nix run .#hashfix -- loop`).
# `cargo test`/`fmt` are green on default, `live` and `tear`; `nix build` is
# UNVERIFIED here. `pending-banken: bancada-tear-feature-nix-unverified`.
tear-client = { git = "https://github.com/pleme-io/tear", branch = "main", optional = true, version = "0.1" }
tear-types = { git = "https://github.com/pleme-io/tear", branch = "main", optional = true, version = "0.1" }

[features]
default = []
# Compile the KubeClusterEnv live-read backend. Heavy dep tree (kube +
# k8s-openapi + rustls) — off by default so the fixture path is fast.
live = ["dep:kube", "dep:k8s-openapi", "dep:anyhow", "dep:rustls"]
# Compile the TearSessionEnv adapter — the live `(defbancada)` handoff over a
# running `tear-daemon`. Off by default: the plan is produced and previewed
# without it, and the dep tree is heavy.
tear = ["dep:tear-client", "dep:tear-types"]

[lints.clippy]
pedantic = "warn"
